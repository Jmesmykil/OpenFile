# OpenFile network share. Installed to /etc/samba/openfile.conf and included
# from smb.conf. Only the modding volume is shared.
[global]
   map to guest = Bad User
   # install.sh announces the share itself, under one name. Without this,
   # Samba announces it a second time and it shows up twice.
   multicast dns register = no

[OpenFile]
   comment = OpenHome DevKit modding volume
   path = @MOUNT@
   browseable = yes
   read only = no
   guest ok = @GUEST@
   valid users = @VALID_USERS@
   force user = @USER@
   create mask = 0664
   directory mask = 0775
   # The volume is FAT, which has no extended attributes and no stable file
   # ids. Macs lean on both. The Apple module hides file ids from them, without
   # which Finder cannot copy a folder here. The extra data a Mac attaches to
   # files is kept in a store on the DevKit's own disk, off the volume, so the
   # volume stays clean. The validity check needs an attribute FAT cannot hold,
   # and with it on, the volume fills up with empty lost-NNNN folders.
   vfs objects = catia fruit streams_depot
   streams_depot:directory = @STREAMS@
   streams_depot:check_valid = no
   fruit:metadata = stream
   fruit:resource = stream
   fruit:encoding = native
   fruit:posix_rename = yes
   fruit:delete_empty_adfiles = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
