# Optional developer shares, installed with: sudo ./install.sh --dev-shares
# These reach live code and the account home, so they always require a login.
[Abilities-Live]
   comment = Abilities as the device runs them
   path = @CAPS_DIR@
   browseable = yes
   read only = no
   guest ok = no
   valid users = @USER@
   force user = @USER@

[DevKit-Home]
   comment = DevKit account home
   path = @HOME@
   browseable = yes
   read only = no
   guest ok = no
   valid users = @USER@
   force user = @USER@
   veto files = /.env/.ssh/.gnupg/
